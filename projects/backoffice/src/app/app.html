<main class="min-h-screen bg-slate-900 text-slate-100 p-8">
  <div class="max-w-4xl mx-auto space-y-8">
    <header class="flex items-center justify-between border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-indigo-400 flex items-center gap-2">
          <i class="pi pi-cog text-2xl"></i> EcoTanti Backoffice
        </h1>
        <p class="text-slate-400 text-sm">Panel de Administración (PWA + Optimus UI + Tailwind)</p>
      </div>
      <p-tag value="Modo Offline Listo" severity="info" icon="pi pi-cloud" />
    </header>

    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <p-card>
        <ng-template #title>
          <div class="flex justify-between items-center text-slate-900">
            <span class="text-xl font-bold">Catálogo & Stock</span>
            <p-tag value="12 Productos" severity="contrast" />
          </div>
        </ng-template>
        <ng-template #subtitle>
          <span class="text-slate-500">Última sincronización: Hoy 09:30</span>
        </ng-template>

        <p class="text-slate-600 text-sm my-3">
          Prueba de integración de componentes Optimus UI en panel de control.
        </p>

        <ng-template #footer>
          <div class="flex gap-3">
            <p-button label="Nuevo Producto" icon="pi pi-plus" severity="success" class="w-full" styleClass="w-full" />
            <p-button label="Sincronizar" icon="pi pi-sync" [outlined]="true" />
          </div>
        </ng-template>
      </p-card>
    </section>

    <router-outlet />
  </div>
</main>
