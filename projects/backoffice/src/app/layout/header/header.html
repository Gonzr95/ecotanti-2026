<header class="fixed top-0 left-0 right-0 h-16 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 z-30 px-4 flex items-center justify-between">
  <!-- Izquierda: Botón Hamburguesa + Logotipo / Título -->
  <div class="flex items-center gap-3">
    <p-button
      type="button"
      icon="pi pi-bars"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      ariaLabel="Abrir menú"
      styleClass="!w-10 !h-10 !text-slate-300 hover:!bg-slate-800 hover:!text-white"
      (click)="toggleMenu.emit()"
    />
    <div class="flex items-center gap-2 select-none">
      <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-indigo-600/20 text-indigo-400 border border-indigo-500/30">
        <i class="pi pi-shield text-base"></i>
      </span>
      <span class="font-bold text-lg text-white tracking-tight">EcoTanti</span>
      <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 font-medium">Backoffice</span>
    </div>
  </div>

  <!-- Derecha: Cerrar Sesión Minimalista -->
  <div class="flex items-center">
    <p-button
      type="button"
      icon="pi pi-sign-out"
      label="Cerrar Sesión"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      styleClass="!text-sm !text-slate-400 hover:!text-red-400 hover:!bg-red-950/20"
      (click)="onLogout()"
    />
  </div>
</header>
